[versions]
agp = "8.13.2"
kotlin = "2.2.21"
ksp = "2.2.21-2.0.5"
coreKtx = "1.17.0"
activity = "1.12.4"
lifecycle = "2.9.4"
composeBom = "2026.06.01"
navigation = "2.9.8"
coroutines = "1.10.2"
room = "2.8.4"
datastore = "1.2.1"
junit = "4.13.2"
robolectric = "4.16.1"
testCore = "1.7.0"
androidxTestJunit = "1.3.0"
androidxTestRunner = "1.7.0"

[libraries]
androidx-compose-bom          = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui           = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics  = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling   = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-preview   = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3    = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-activity-compose     = { group = "androidx.activity", name = "activity-compose", version.ref = "activity" }
androidx-navigation-compose   = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
androidx-lifecycle-vm-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-core-ktx        = { group = "androidx.core",       name = "core-ktx",              version.ref = "coreKtx" }
androidx-activity-ktx        = { group = "androidx.activity", name = "activity-ktx", version.ref = "activity" }
androidx-lifecycle-runtime    = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-datastore-prefs = { group = "androidx.datastore",  name = "datastore-preferences", version.ref = "datastore" }
androidx-room-runtime    = { group = "androidx.room",       name = "room-runtime",          version.ref = "room" }
androidx-room-ktx        = { group = "androidx.room",       name = "room-ktx",              version.ref = "room" }
androidx-room-compiler   = { group = "androidx.room",       name = "room-compiler",         version.ref = "room" }
kotlinx-coroutines       = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# test
junit                    = { group = "junit",               name = "junit",                 version.ref = "junit" }
robolectric              = { group = "org.robolectric",     name = "robolectric",           version.ref = "robolectric" }
androidx-test-core       = { group = "androidx.test",       name = "core",                  version.ref = "testCore" }
androidx-test-junit      = { group = "androidx.test.ext",   name = "junit",                 version.ref = "androidxTestJunit" }
androidx-test-runner     = { group = "androidx.test",       name = "runner",                version.ref = "androidxTestRunner" }
kotlinx-coroutines-test  = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-room-testing    = { group = "androidx.room",       name = "room-testing",          version.ref = "room" }

[plugins]
android-application = { id = "com.android.application",              version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",         version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose",  version.ref = "kotlin" }
ksp                 = { id = "com.google.devtools.ksp",              version.ref = "ksp" }
