apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: letters-ingress
  namespace: homelab
  annotations:
    cert-manager.io/cluster-issuer: "homelab-ca-issuer"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - letters.homelab.local
      secretName: letters-tls
  rules:
    - host: letters.homelab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: letters-frontend
                port:
                  number: 80
