apiVersion: apps/v1
kind: Deployment
metadata:
  name: letters-backend
  namespace: homelab
  labels:
    app: letters-backend
    env: homelab
    managed-by: kubectl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: letters-backend
  template:
    metadata:
      labels:
        app: letters-backend
        env: homelab
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: letters-backend
          image: localhost:30500/homelab/letters-backend:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: letters-config
            - secretRef:
                name: letters-db-secret
          volumeMounts:
            - name: firebase-credentials
              mountPath: /etc/firebase
              readOnly: true
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
      volumes:
        - name: firebase-credentials
          secret:
            secretName: letters-firebase
